<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 700" role="img" aria-labelledby="title desc"><title id="title">Distribución FTTH por puerto GPON</title><desc id="desc">Cuatro CTO en cascada. Cada una alimenta dos NAP de ocho salidas con capacidad para dieciséis abonados.</desc><rect width="840" height="700" fill="#102438"/><style>text{font-family:system-ui,sans-serif;fill:#edf5fa}.h{font-size:26px;font-weight:bold}.t{font-size:18px}.l{font-size:15px;fill:#abe7dc}.p{stroke:#60d3bd;fill:none;stroke-width:4}.pulse{stroke:#fff;fill:none;stroke-width:3;stroke-dasharray:5 90;animation:flow 5s linear infinite}@keyframes flow{to{stroke-dashoffset:-190}}@media(prefers-reduced-motion:reduce){.pulse{animation:none;display:none}}</style><text x="24" y="44" class="h">Recorrido de una fibra GPON</text><text x="24" y="77" class="l">Central → planta externa → abonado · sentido descendente</text><rect x="24" y="98" width="190" height="48" rx="8" fill="#19384c" stroke="#5e8897"/><text x="36" y="128" class="t">OLT · SFP C+</text><path class="p" d="M214 122H422"/><rect x="422" y="98" width="377" height="48" rx="8" fill="#19384c" stroke="#5e8897"/><text x="434" y="128" class="t">ODF exterior · SC/APC</text><text x="226" y="110" class="l">ODF · feeder 1,66 km</text><path class="p" d="M600 146V169H109V521"/><rect x="23" y="187" width="172" height="48" rx="8" fill="#19384c" stroke="#5e8897"/><text x="35" y="217" class="t">CTO1 · 80/20</text><path class="p" d="M195 212H330"/><text x="202" y="205" class="l">20 % local</text><rect x="330" y="187" width="215" height="48" rx="8" fill="#19384c" stroke="#5e8897"/><text x="342" y="217" class="t">División local 50/50</text><path class="p" d="M545 212H562V194H580 M562 212V233H580"/><text x="585" y="199" class="t">NAP 1×8 · inicial</text><text x="585" y="238" class="t">NAP 1×8 · ampliación</text><text x="122" y="265" class="l">80 % continúa</text><rect x="23" y="290" width="172" height="48" rx="8" fill="#19384c" stroke="#5e8897"/><text x="35" y="320" class="t">CTO2 · 70/30</text><path class="p" d="M195 315H330"/><text x="202" y="308" class="l">30 % local</text><rect x="330" y="290" width="215" height="48" rx="8" fill="#19384c" stroke="#5e8897"/><text x="342" y="320" class="t">División local 50/50</text><path class="p" d="M545 315H562V297H580 M562 315V336H580"/><text x="585" y="302" class="t">NAP 1×8 · inicial</text><text x="585" y="341" class="t">NAP 1×8 · ampliación</text><text x="122" y="368" class="l">70 % continúa</text><rect x="23" y="393" width="172" height="48" rx="8" fill="#19384c" stroke="#5e8897"/><text x="35" y="423" class="t">CTO3 · 55/45</text><path class="p" d="M195 418H330"/><text x="202" y="411" class="l">45 % local</text><rect x="330" y="393" width="215" height="48" rx="8" fill="#19384c" stroke="#5e8897"/><text x="342" y="423" class="t">División local 50/50</text><path class="p" d="M545 418H562V400H580 M562 418V439H580"/><text x="585" y="405" class="t">NAP 1×8 · inicial</text><text x="585" y="444" class="t">NAP 1×8 · ampliación</text><text x="122" y="471" class="l">55 % continúa</text><rect x="23" y="496" width="172" height="48" rx="8" fill="#19384c" stroke="#5e8897"/><text x="35" y="526" class="t">CTO4 · 50/50</text><path class="p" d="M195 521H330"/><text x="202" y="514" class="l">dos salidas</text><rect x="330" y="496" width="215" height="48" rx="8" fill="#19384c" stroke="#5e8897"/><text x="342" y="526" class="t">División en CTO4</text><path class="p" d="M545 521H562V503H580 M562 521V542H580"/><text x="585" y="508" class="t">NAP 1×8 · inicial</text><text x="585" y="547" class="t">NAP 1×8 · ampliación</text><path class="pulse" d="M214 122H422 M600 146V169H109V187"/><text x="24" y="613" class="h">Cada salida de NAP → acometida individual → ONT B+</text><text x="24" y="650" class="l">4 CTO × 2 NAP × 8 salidas = 64 posiciones por puerto a plena expansión.</text><text x="24" y="678" class="l">Los porcentajes indican reparto nominal. La animación señala dirección, no velocidad.</text></svg>