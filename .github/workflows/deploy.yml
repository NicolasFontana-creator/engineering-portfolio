name: Build and deploy portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Check sections and resource paths
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sections = []
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "section":
                      self.sections.append(attrs.get("id"))
                  for key in ("href", "src"):
                      if attrs.get(key):
                          self.links.append(attrs[key])

          page = Page()
          page.feed(Path("dist/index.html").read_text())
          base = "/engineering-portfolio/"
          for section in ("home", "about", "projects", "skills", "contact"):
              assert page.sections.count(section) == 1, section
              assert "#" + section in page.links, section
          for link in page.links:
              if link.startswith("#"):
                  assert link[1:] in page.sections, link
              elif link.startswith("/"):
                  assert link.startswith(base), link
                  assert (Path("dist") / link.removeprefix(base)).is_file(), link
          PY
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
